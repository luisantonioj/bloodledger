name: bloodledger

services:
  ca-mediatrix:
    image: hyperledger/fabric-ca:1.5.15
    restart: unless-stopped
    environment:
      FABRIC_CA_SERVER_HOME: /work/fabric-ca/mediatrix
    command:
      - /bin/sh
      - -c
      - >-
        test -f /work/fabric-ca/mediatrix/fabric-ca-server-config.yaml ||
          { echo 'Run network/scripts/bootstrap-identities.sh to create the untracked CA configuration' >&2; exit 1; };
        exec fabric-ca-server start --home /work/fabric-ca/mediatrix
    ports:
      - "127.0.0.1:7054:7054"
    volumes:
      - ./network/generated:/work
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-client getcainfo --url https://localhost:7054 --tls.certfiles /work/fabric-ca/mediatrix/tls-cert.pem >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  ca-orderer:
    image: hyperledger/fabric-ca:1.5.15
    restart: unless-stopped
    environment:
      FABRIC_CA_SERVER_HOME: /work/fabric-ca/orderer
    command:
      - /bin/sh
      - -c
      - >-
        test -f /work/fabric-ca/orderer/fabric-ca-server-config.yaml ||
          { echo 'Run network/scripts/bootstrap-identities.sh to create the untracked CA configuration' >&2; exit 1; };
        exec fabric-ca-server start --home /work/fabric-ca/orderer
    ports:
      - "127.0.0.1:8054:7054"
    volumes:
      - ./network/generated:/work
    healthcheck:
      test: ["CMD-SHELL", "fabric-ca-client getcainfo --url https://localhost:7054 --tls.certfiles /work/fabric-ca/orderer/tls-cert.pem >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  peer0-mediatrix:
    image: hyperledger/fabric-peer:2.5.16
    hostname: peer0.mediatrix.bloodledger.local
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.mediatrix.bloodledger.local
      CORE_PEER_ADDRESS: peer0.mediatrix.bloodledger.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.mediatrix.bloodledger.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.mediatrix.bloodledger.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.mediatrix.bloodledger.local:7051
      CORE_PEER_LOCALMSPID: MediatrixMSP
      CORE_PEER_MSPCONFIGPATH: /opt/bloodledger/fabric/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /opt/bloodledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /opt/bloodledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /opt/bloodledger/fabric/tls/ca.crt
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      CORE_OPERATIONS_TLS_ENABLED: "false"
      CORE_METRICS_PROVIDER: disabled
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_VM_ENDPOINT: unix:///var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: bloodledger_default
      CORE_CHAINCODE_NODE_RUNTIME: hyperledger/fabric-nodeenv@sha256:17e2d447ca0de5b4e3f6950a1c9b24ecfdeecdd90e111e11d771970d35159bf1
      CORE_CHAINCODE_PULL: "false"
    command: peer node start
    ports:
      - "127.0.0.1:7051:7051"
    volumes:
      - ./network/generated/organizations/peerOrganizations/mediatrix.bloodledger.local/peers/peer0.mediatrix.bloodledger.local/msp:/opt/bloodledger/fabric/msp:ro
      - ./network/generated/organizations/peerOrganizations/mediatrix.bloodledger.local/peers/peer0.mediatrix.bloodledger.local/tls:/opt/bloodledger/fabric/tls:ro
      - peer0-mediatrix-config:/etc/hyperledger/fabric
      - peer0-mediatrix-data:/var/hyperledger
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9443;
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - peer0.mediatrix.bloodledger.local

  orderer0:
    image: hyperledger/fabric-orderer:2.5.16
    hostname: orderer0.orderer.bloodledger.local
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /opt/bloodledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /opt/bloodledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /opt/bloodledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/opt/bloodledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /opt/bloodledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /opt/bloodledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/opt/bloodledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /opt/bloodledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /opt/bloodledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/opt/bloodledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/opt/bloodledger/orderer/tls/ca.crt]'
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8443
      ORDERER_OPERATIONS_TLS_ENABLED: "false"
      ORDERER_METRICS_PROVIDER: disabled
      ORDERER_GENERAL_PROFILE_ENABLED: "false"
    command: orderer
    ports:
      - "127.0.0.1:7050:7050"
    volumes:
      - ./network/generated/organizations/ordererOrganizations/orderer.bloodledger.local/orderers/orderer0.orderer.bloodledger.local/msp:/opt/bloodledger/orderer/msp:ro
      - ./network/generated/organizations/ordererOrganizations/orderer.bloodledger.local/orderers/orderer0.orderer.bloodledger.local/tls:/opt/bloodledger/orderer/tls:ro
      - orderer0-config:/etc/hyperledger/fabric
      - orderer0-data:/var/hyperledger
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8443;
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - orderer0.orderer.bloodledger.local

  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: bloodledger_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in the untracked .env file}
      POSTGRES_MIGRATOR_USER: bloodledger_migrator
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in the untracked .env file}
      POSTGRES_APP_USER: bloodledger_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in the untracked .env file}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bloodledger_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  forecasting:
    profiles:
      - forecasting
    build:
      context: ./services/forecasting
      dockerfile: Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bloodledger_dev
      POSTGRES_APP_USER: bloodledger_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in the untracked .env file}
    volumes:
      - ./services/forecasting/data:/workspace/data
      - ./services/forecasting/artifacts:/workspace/artifacts

  api:
    profiles:
      - sprint4
    image: bloodledger-sprint4-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      CAPTURE_PWA_DIST: /workspace/apps/capture-pwa/dist
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bloodledger_dev
      POSTGRES_APP_USER: bloodledger_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in the untracked .env file}
      SPRINT4_OPERATOR_ID: ${SPRINT4_OPERATOR_ID:-USR_SYNTH_CAPTURE}
      SPRINT4_OPERATOR_CREDENTIAL: ${SPRINT4_OPERATOR_CREDENTIAL:-}
      SPRINT4_JWT_SECRET: ${SPRINT4_JWT_SECRET:-}
      FABRIC_SYNC_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  sync-worker:
    profiles:
      - sprint4
    image: bloodledger-sprint4-api:local
    command: ["node", "services/api/build/src/worker-main.js"]
    environment:
      BLOODLEDGER_REPOSITORY_ROOT: /workspace
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bloodledger_dev
      POSTGRES_APP_USER: bloodledger_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in the untracked .env file}
      FABRIC_SYNC_ENABLED: "true"
      FABRIC_PEER_ENDPOINT: peer0-mediatrix:7051
      FABRIC_PEER_HOST_ALIAS: peer0.mediatrix.bloodledger.local
      FABRIC_CHANNEL: bloodledger-dev
      FABRIC_CHAINCODE: bloodledger-inventory
    volumes:
      - ./network/generated:/workspace/network/generated:ro
    depends_on:
      postgres:
        condition: service_healthy
      peer0-mediatrix:
        condition: service_healthy

volumes:
  orderer0-config:
  orderer0-data:
  peer0-mediatrix-config:
  peer0-mediatrix-data:
  postgres-data:
