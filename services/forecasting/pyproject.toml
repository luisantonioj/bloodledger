[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodledger-forecasting"
version = "0.1.0"
description = "Simulation-only demand forecasting worker for BloodLedger Sprint 3"
requires-python = "==3.13.*"
dependencies = [
  "numpy==2.4.3",
  "pandas==3.0.5",
  "psycopg[binary]==3.3.4",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
analysis = ["jupyterlab==4.6.2"]
dev = [
  "mypy==2.3.0",
  "pip-tools==7.6.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
bloodledger-forecasting = "bloodledger_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["bloodledger_forecasting"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas", "pandas.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
